name: Refresh Sleeper League Data

on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Fetch current Sleeper player database
        run: |
          curl -fsSL \
            "https://api.sleeper.app/v1/players/nfl" \
            -o /tmp/players.json

      - name: Fetch current Sleeper data and add player names
        run: |
          mkdir -p data

          for item in \
            "dleague:1384998212942692352" \
            "bcl:1387554218847502336" \
            "howl:1400845991007019008"
          do
            name="${item%%:*}"
            id="${item##*:}"

            curl -fsSL \
              "https://sleeper-json-bridge.vercel.app/api/league?league_id=${id}" \
              -o "/tmp/${name}.json"

            jq --slurpfile players /tmp/players.json '
              (
                [
                  .rosters[]?
                  | (.players // []),
                    (.reserve // []),
                    (.taxi // [])
                ]
                + [
                  .recent_transactions[]?
                  | ((.adds // {}) | keys),
                    ((.drops // {}) | keys)
                ]
                | flatten
                | unique
              ) as $ids
              |
              .player_map = (
                $ids
                | map(
                    . as $id
                    | ($players[0][$id] // null) as $p
                    | {
                        key: $id,
                        value:
                          (if $p == null then null else {
                            player_id: ($p.player_id // $id),
                            full_name: ($p.full_name // ([ $p.first_name, $p.last_name ] | map(select(. != null and . != "")) | join(" "))),
                            position: ($p.position // null),
                            team: ($p.team // null),
                            age: ($p.age // null),
                            status: ($p.status // null),
                            injury_status: ($p.injury_status // null),
                            fantasy_positions: ($p.fantasy_positions // [])
                          } end)
                      }
                  )
                | from_entries
              )
            ' "/tmp/${name}.json" > "data/${name}.json"
          done

      - name: Commit refreshed data
        run: |
          git config user.name "Sleeper Matrix Bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add data/*.json

          if git diff --cached --quiet; then
            echo "No changes."
          else
            git commit -m "Refresh Sleeper league data with player names"
            git push
          fi