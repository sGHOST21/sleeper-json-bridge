name: Refresh Sleeper League Data

on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Fetch current Sleeper data
        run: |
          mkdir -p data

          for item in \
            "dleague:1384998212942692352" \
            "bcl:1387554218847502336" \
            "howl:1400845991007019008"
          do
            name="${item%%:*}"
            id="${item##*:}"

            curl -fsSL \
              "https://sleeper-json-bridge.vercel.app/api/league?league_id=${id}" \
              -o "data/${name}.json"
          done

      - name: Commit refreshed data
        run: |
          git config user.name "Sleeper Matrix Bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add data/*.json

          if git diff --cached --quiet; then
            echo "No changes."
          else
            git commit -m "Refresh Sleeper league data"
            git push
          fi
